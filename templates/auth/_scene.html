<div class="tower-scene" aria-hidden="true">
  <div class="scene-copy">
    <span class="scene-eyebrow">{{ eyebrow }}</span>
    <h1 class="scene-title">{{ headline|safe }}</h1>
    <p class="scene-sub">{{ subline }}</p>
  </div>

  <div class="skyline"></div>

  <div class="tower">
    <div class="tower-antenna"><span class="tower-beacon"></span></div>
    <div class="tower-crown"></div>
    <div class="tower-body">
      <div class="tower-windows"></div>
      <div class="tower-door">
        <div class="door-light"></div>
        <div class="door-panel door-l"></div>
        <div class="door-panel door-r"></div>
      </div>
    </div>
    <div class="tower-base"></div>
    <div class="tower-reflection"></div>
  </div>

  <div class="floor-chip"><b data-floor-count>2</b><span>Floors lit</span></div>
  <div class="tower-ground"></div>
</div>
