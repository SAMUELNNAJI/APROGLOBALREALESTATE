<div class="field{% if field.errors %} has-error{% endif %}">
  {{ field }}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if is_password %}
  <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  {% endif %}
  {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
</div>
